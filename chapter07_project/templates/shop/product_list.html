<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제7장 MySQL 상품 목록</title>
  {% load static %}
<link rel="stylesheet" href="{% static 'shop/style.css' %}">
</head>
<body>
<main class="container">
<h1>MySQL 상품 목록</h1>
<p>Docker MySQL과 Django ORM을 연결한 결과이다.</p>
<table>
<thead><tr><th>상품명</th><th>가격</th><th>재고</th></tr></thead>
<tbody>
    {% for product in products %}
<tr><td>{{ product.name }}</td><td>{{ product.price }}원</td><td>{{ product.stock }}개</td></tr>
    {% empty %}
<tr><td colspan="3">등록된 상품이 없습니다.</td></tr>
    {% endfor %}
</tbody>
</table>
</main>
</body>
</html>
